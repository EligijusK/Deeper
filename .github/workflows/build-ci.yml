name: Build Deeper

on:
  push:
    branches:
      - main
      - Dev

  pull_request:
    branches:
      - main
      - Dev

  workflow_dispatch:

jobs:

  # ==========================================================
  # ANDROID
  # ==========================================================

  build:
    name: Test and Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: deeper-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ==========================================================
  # IOS
  # ==========================================================

  ios:
    name: iOS Build and Test
    runs-on: macos-latest

    env:
      IOS_PROJECT: iosApp/iosApp.xcodeproj
      IOS_SCHEME: iosApp
      EXPORT_OPTIONS_PLIST: iosApp/ExportOptions.plist
      TEAM_ID: 3Z24U3RF5U

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create iOS Maps secrets config
        if: github.event_name != 'pull_request'
        env:
          IOS_MAPS_API_KEY: ${{ secrets.IOS_MAPS_API_KEY }}
        run: |
          if [ -z "$IOS_MAPS_API_KEY" ]; then
            echo "IOS_MAPS_API_KEY is not configured"
            exit 1
          fi

          printf 'MAPS_API_KEY=%s\n' "$IOS_MAPS_API_KEY" \
            > iosApp/Configuration/Secrets.xcconfig

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Show build environment
        run: |
          xcodebuild -version
          java -version
          ./gradlew --version

      - name: List Xcode project
        run: |
          xcodebuild \
            -project "$IOS_PROJECT" \
            -list

      - name: Build iOS Simulator app
        if: github.event_name == 'pull_request'
        run: |
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install Apple certificate and provisioning profile
        if: github.event_name != 'pull_request'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          echo -n "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode -o "$CERTIFICATE_PATH"

          echo -n "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode -o "$PP_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security cms \
            -D \
            -i "$PP_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          echo "Provisioning profile:"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PP_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Show signing identities
        if: github.event_name != 'pull_request'
        run: |
          security find-identity \
            -v \
            -p codesigning

      - name: Archive iOS application
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Deeper.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -showBuildTimingSummary \
            archive

      - name: Export IPA
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/ipa"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Deeper.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/iosApp/iosApp/ExportOptions.plist"

      - name: Show generated IPA
        if: github.event_name != 'pull_request'
        run: |
          echo "Generated files:"
          find "$RUNNER_TEMP/ipa" \
            -maxdepth 2 \
            -type f \
            -print

      - name: Upload iOS IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Deeper-iOS
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

  # ==========================================================
  # RELEASE 1.1.0
  # ==========================================================

  release:
    name: Create release 1.1.0
    needs:
      - build
      - ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android APK
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/download-artifact@v7
        with:
          name: deeper-debug-apk
          path: release-assets/android

      - name: Download iOS IPA
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/download-artifact@v7
        with:
          name: Deeper-iOS
          path: release-assets/ios

      - name: Prepare release files
        if: steps.release_check.outputs.exists != 'true'
        run: |
          APK=$(find release-assets/android -type f -name '*.apk' | head -n 1)
          IPA=$(find release-assets/ios -type f -name '*.ipa' | head -n 1)

          if [ -z "$APK" ] || [ -z "$IPA" ]; then
            echo "Both Android APK and iOS IPA are required"
            exit 1
          fi

          mv "$APK" release-assets/Deeper-1.1.0-Android.apk
          mv "$IPA" release-assets/Deeper-1.1.0-iOS.ipa

      - name: Create GitHub release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 \
            release-assets/Deeper-1.1.0-Android.apk \
            release-assets/Deeper-1.1.0-iOS.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Deeper 1.1.0" \
            --notes "Deeper 1.1.0 technical-task build. Includes compiled Android APK and iOS IPA artifacts from the successful CI workflow."
