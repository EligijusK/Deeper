name: Build Deeper

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev
      
  workflow_dispatch:
  
jobs:

  # ==========================================================
  # ANDROID
  # ==========================================================
  
  build:
    name: Test and Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: deeper-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ==========================================================
  # IOS
  # ==========================================================
  
  ios:
    name: iOS Build and Test
    runs-on: macos-latest

    env:
      IOS_PROJECT: iosApp/iosApp.xcodeproj
      IOS_SCHEME: iosApp
      EXPORT_OPTIONS_PLIST: iosApp/ExportOptions.plist

      # Your Apple Distribution team
      TEAM_ID: 3Z24U3RF5U

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create iOS Maps secrets config
        if: github.event_name != 'pull_request'
        env:
          IOS_MAPS_API_KEY: ${{ secrets.IOS_MAPS_API_KEY }}
        run: |
          if [ -z "$IOS_MAPS_API_KEY" ]; then
            echo "IOS_MAPS_API_KEY is not configured"
            exit 1
          fi

          printf 'MAPS_API_KEY=%s\n' "$IOS_MAPS_API_KEY" \
            > iosApp/Configuration/Secrets.xcconfig

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Show build environment
        run: |
          xcodebuild -version
          java -version
          ./gradlew --version

      - name: List Xcode project
        run: |
          xcodebuild \
            -project "$IOS_PROJECT" \
            -list

      # ======================================================
      # PULL REQUEST
      #
      # Don't expose signing secrets to pull-request code.
      # Instead make sure the full iOS app compiles for the
      # simulator.
      # ======================================================

      - name: Build iOS Simulator app
        if: github.event_name == 'pull_request'
        run: |
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ======================================================
      # SIGNING
      # ======================================================

      - name: Install Apple certificate and provisioning profile
        if: github.event_name != 'pull_request'

        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          # Decode certificate
          echo -n "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode -o "$CERTIFICATE_PATH"

          # Decode provisioning profile
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode -o "$PP_PATH"

          # Create temporary keychain
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Import Apple Distribution certificate
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          # Decode provisioning profile metadata
          security cms \
            -D \
            -i "$PP_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          echo "Provisioning profile:"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

          # Install provisioning profile
          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PP_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # Make profile available to following workflow steps
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      # ======================================================
      # CHECK SIGNING IDENTITY
      # ======================================================

      - name: Show signing identities
        if: github.event_name != 'pull_request'
        run: |
          security find-identity \
            -v \
            -p codesigning

      # ======================================================
      # CREATE XCARCHIVE
      # ======================================================

      - name: Archive iOS application
        run: |
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Deeper.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -showBuildTimingSummary \
            archive

       # ======================================================
      # EXPORT IPA
      # ======================================================

      - name: Export IPA
        if: github.event_name != 'pull_request'

        run: |
          mkdir -p "$RUNNER_TEMP/ipa"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Deeper.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/iosApp/iosApp/ExportOptions.plist"

      # ======================================================
      # VERIFY
      # ======================================================

      - name: Show generated IPA
        if: github.event_name != 'pull_request'

        run: |
          echo "Generated files:"
          find "$RUNNER_TEMP/ipa" \
            -maxdepth 2 \
            -type f \
            -print
      # ======================================================
      # UPLOAD IPA
      # ======================================================

      - name: Upload iOS IPA
        if: github.event_name != 'pull_request'

        uses: actions/upload-artifact@v4

        with:
          name: Deeper-iOS
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
